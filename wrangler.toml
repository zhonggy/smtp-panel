#:schema node_modules/wrangler/config-schema.json
name = "smtp-panel"
main = "apps/worker/src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 前端静态资产(React 构建产物,同源部署,免 CORS)
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 业务数据库
# database_id 为占位值(全零 UUID)。一键部署时 Cloudflare 会自动创建资源
# 并改写为真实 ID;手动部署时由 scripts/gen-config.mjs 自动填充。
[[d1_databases]]
binding = "DB"
database_name = "smtp-panel"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

# KV:Session / 限流 / 队列节流锁(id 同上,为占位值)
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

# 发信队列(生产者:API 入队;消费者:同 Worker 处理)
[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "smtp-panel-mail"

[[queues.consumers]]
queue = "smtp-panel-mail"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 2
max_concurrency = 3

# 每分钟巡检:恢复卡住的任务
[triggers]
crons = ["* * * * *"]

# 将 SQL 迁移文件作为文本导入(运行时自动建表兜底)
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = false

[observability]
enabled = true
